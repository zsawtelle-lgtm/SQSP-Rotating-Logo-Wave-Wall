<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logo Wave Wall Demo</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #1f2328; }
    .intro { max-width: 900px; margin: 0 auto; padding: 48px 16px 8px; text-align: center; }
    .user-items-list { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .user-items-list-carousel__slides { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; list-style: none; padding: 0; }
    .user-items-list-carousel__slides img { width: 100%; }
  </style>
  <link rel="stylesheet" href="../src/logo-wave.css">
  <!-- Toggle overrides must come after the plugin CSS. Demo logos are wordmarks, so show them whole. -->
  <style>:root { --lw-fit: contain; }</style>
</head>
<body>
  <div class="intro">
    <h1>Trusted by</h1>
    <p>Mock Squarespace List Section (carousel) with 10 logos. Position 1 rotates logos 1 &amp; 6, position 2 rotates 2 &amp; 7, and so on.</p>
  </div>

  <!-- Mirrors the markup Squarespace renders for a List Section in Carousel layout -->
  <section class="page-section user-items-list-section">
    <div class="user-items-list">
      <div class="user-items-list-carousel">
        <ul class="user-items-list-carousel__slides">
          <li class="user-items-list-carousel__slide list-item"><div class="list-item-media"><img data-src="logos/logo-1.svg" src="logos/logo-1.svg" alt="Client logo 1"></div></li>
          <li class="user-items-list-carousel__slide list-item"><div class="list-item-media"><img data-src="logos/logo-2.svg" src="logos/logo-2.svg" alt="Client logo 2"></div></li>
          <li class="user-items-list-carousel__slide list-item"><div class="list-item-media"><img data-src="logos/logo-3.svg" src="logos/logo-3.svg" alt="Client logo 3"></div></li>
          <li class="user-items-list-carousel__slide list-item"><div class="list-item-media"><img data-src="logos/logo-4.svg" src="logos/logo-4.svg" alt="Client logo 4"></div></li>
          <li class="user-items-list-carousel__slide list-item"><div class="list-item-media"><img data-src="logos/logo-5.svg" src="logos/logo-5.svg" alt="Client logo 5"></div></li>
          <li class="user-items-list-carousel__slide list-item"><div class="list-item-media"><img data-src="logos/logo-6.svg" src="logos/logo-6.svg" alt="Client logo 6"></div></li>
          <li class="user-items-list-carousel__slide list-item"><div class="list-item-media"><img data-src="logos/logo-7.svg" src="logos/logo-7.svg" alt="Client logo 7"></div></li>
          <li class="user-items-list-carousel__slide list-item"><div class="list-item-media"><img data-src="logos/logo-8.svg" src="logos/logo-8.svg" alt="Client logo 8"></div></li>
          <li class="user-items-list-carousel__slide list-item"><div class="list-item-media"><img data-src="logos/logo-9.svg" src="logos/logo-9.svg" alt="Client logo 9"></div></li>
          <li class="user-items-list-carousel__slide list-item"><div class="list-item-media"><img data-src="logos/logo-10.svg" src="logos/logo-10.svg" alt="Client logo 10"></div></li>
        </ul>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="../src/logo-wave.js"></script>
</body>
</html>
